<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멀티타이머 발표자 화면</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0f1b33">
<link rel="stylesheet" href="common.css">
<style>
body{display:flex;padding:clamp(8px,2vw,16px)}
.stage{flex:1}
.msg{position:fixed;inset:0;background:rgba(11,20,38,.94);display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:6;font-size:clamp(18px,3vw,28px)}
.msg[hidden]{display:none}
.popbtn button{font-size:14px;margin-left:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.popbtn{z-index:7!important;position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;opacity:.5}
.popbtn:hover,.popbtn:focus{opacity:1}
/* 보조 화면(작은 창) */
.mini body{padding:4px}
.mini .stage{border-radius:10px;border-width:1px;padding:4px}
.mini .slot,.mini .state,.mini .popbtn{display:none}
.mini .name{font-size:clamp(11px,9vh,22px);margin:0}
.mini .time{font-size:min(30vw,58vh)}
.mini .flag{font-size:min(10vw,22vh);top:2px;right:6px}
.mini .bar{height:5px}
.mini .msg{font-size:14px;gap:8px;padding:8px}
.msg .btn{min-width:min(80vw,360px)}
.msg input{max-width:min(80vw,360px);text-align:center;font-size:28px;letter-spacing:.2em}
</style>
</head>
<body>
<div class="popbtn" id="popbox"><button id="pip" hidden>📌 항상 위에 띄우기</button><button id="pop">작은 창으로 열기</button></div>
<div class="conn" id="conn">연결 끊김</div>
<div class="stage" id="stage">
  <div class="flag">🚩</div>
  <div class="slot" id="slot"></div>
  <div class="name" id="name"></div>
  <div class="time" id="time">--:--</div>
  <div class="state" id="state"></div>
  <div class="bar" id="bar"></div>
</div>
<div class="msg" id="join" hidden>
  <div>방 코드 6자리를 입력하세요</div>
  <input id="code" inputmode="numeric" maxlength="6" placeholder="000000">
  <button class="btn go" id="joinBtn">입장</button>
</div>
<div class="msg" id="tap" hidden>
  <div id="tapMsg">연결 중…</div>
  <button class="btn go" id="tapBtn" hidden>탭해서 시작 (소리·화면 유지 켜기)</button>
</div>

<script type="module">
import { login, syncClock, watchRoom, remaining } from './fb.js';
import { unlock, beep, ring, stopRing, vib, wakeLock, fmt } from './audio.js';
const cache = {};
const $ = id => cache[id] || (cache[id] = document.getElementById(id));
['stage','slot','name','time','state','bar','conn','join','code','joinBtn','tap','tapMsg','tapBtn','pop','pip'].forEach($);
/* 타이머 박자: 숨은 창에서도 느려지지 않도록 워커 사용 (PPT 뒤에 가려져도 벨이 정확히 울림) */
const ticker = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),100)'])));
const q = new URLSearchParams(location.search);
const MINI = q.get('mini') === '1';
if (MINI) document.documentElement.classList.add('mini');
let code = (q.get('room') || '').replace(/\D/g, '');
let room = null, fromCache = false, offSince = 0, belledKey = '', warned = false, prevRem = 0;

if (!/^\d{6}$/.test(code)) { $('join').hidden = false;
  $('joinBtn').onclick = () => { const c = $('code').value.replace(/\D/g, ''); if (c.length === 6) { q.set('room', c); location.search = q.toString(); } };
} else start();

async function start() {
  $('tap').hidden = false;
  try {
    await login();
    syncClock().catch(() => {}); setInterval(() => syncClock().catch(() => {}), 5 * 60 * 1000);
    watchRoom(code, (r, meta) => {
      fromCache = meta.fromCache;
      if (r === null && !meta.fromCache) { $('tapMsg').textContent = '방을 찾을 수 없습니다 (코드: ' + code + ')'; return; }
      if (r) { room = r; if ($('tapBtn').hidden && !tapped) { $('tapMsg').textContent = '연결되었습니다'; $('tapBtn').hidden = false; } }
    }, e => { $('tapMsg').textContent = '연결 오류: ' + (e.code || e.message); });
  } catch (e) { $('tapMsg').textContent = '로그인 실패: ' + (e.code || e.message) + '  (Firebase 익명 로그인이 켜져 있는지 확인)'; }
}
ticker.onmessage = loop;
$('pop').onclick = () => {
  const u = location.origin + location.pathname + '?mini=1&room=' + code;
  const w = window.open(u, 'multitimer-mini', 'popup=yes,width=360,height=220,left=40,top=40');
  if (!w) alert('팝업이 차단되었습니다. 주소창 오른쪽의 팝업 허용을 눌러 주세요.');
};
/* 항상 위(PiP): 크롬/엣지의 Document Picture-in-Picture. 다른 창보다 항상 위에 뜬다 */
if ('documentPictureInPicture' in window) $('pip').hidden = false;
$('pip').onclick = async () => {
  try {
    const pw = await documentPictureInPicture.requestWindow({ width: 360, height: 220 });
    [...document.styleSheets].forEach(ss => {
      try { const st = pw.document.createElement('style'); st.textContent = [...ss.cssRules].map(r => r.cssText).join('\n'); pw.document.head.appendChild(st); } catch (e) {}
    });
    pw.document.documentElement.classList.add('mini');
    pw.document.title = '멀티타이머';
    pw.document.body.append($('stage'), $('conn'));
    pw.addEventListener('pagehide', () => { document.body.prepend($('stage'), $('conn')); });
    pw.document.addEventListener('pointerdown', unlock);
  } catch (e) { alert('이 브라우저에서는 사용할 수 없습니다 (크롬/엣지 최신 버전 필요)'); }
};
let tapped = false;
$('tapBtn').onclick = () => { tapped = true; unlock(); wakeLock(true); $('tap').hidden = true; };

function loop() {
  const online = navigator.onLine && !fromCache;
  if (online) offSince = 0; else if (!offSince) offSince = Date.now();
  $('conn').classList.toggle('show', !!offSince && Date.now() - offSince > 2000);
  if (!room) return;

  const sl = room.slots[room.slotIndex], rem = remaining(room);
  const running = room.status === 'running', key = room.startedMs + ':' + room.presenterIndex;
  const isBell = running && rem <= 0;
  const isWarn = running && rem > 0 && sl.flagSec > 0 && rem <= sl.flagSec;

  if (isBell && belledKey !== key) { belledKey = key; if (prevRem > 0 || -rem < 3) { ring(room.bell); vib(); } }
  prevRem = running ? rem : 0;
  if (!isBell && room.status !== 'running') { belledKey = ''; stopRing(); }
  if (isWarn && !warned) beep(.15, 880);
  warned = isWarn;

  $('slot').textContent = sl.name;
  $('name').textContent = room.presenters[room.presenterIndex] || '';
  $('time').textContent = fmt(rem);
  $('bar').style.transform = 'scaleX(' + (sl.totalSec ? Math.max(0, Math.min(1, rem / sl.totalSec)) : 0) + ')';
  $('state').textContent = isBell ? '시간 종료' : room.status === 'paused' ? '일시정지' : room.status === 'idle' ? '대기' : '';
  $('stage').classList.toggle('bell', isBell);
  $('stage').classList.toggle('warn', isWarn);
}
</script>
</body>
</html>
