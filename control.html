<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멀티타이머 운영자 화면</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0f1b33">
<link rel="stylesheet" href="common.css">
<style>
body{padding:clamp(10px,3vw,20px);display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto;user-select:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-size:26px;font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--sub)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slots button{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 2px;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slots button.on{border-color:var(--blue);background:#1b3563}
.now{display:flex;justify-content:space-between;align-items:baseline;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 16px}
.now b{font-size:22px}.now .t{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.now.warn .t{color:var(--amber)}.now.bell{background:var(--red)}
.list{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.list button{display:flex;justify-content:space-between;text-align:left;background:var(--panel);border:2px solid transparent;border-radius:10px;padding:12px 14px;font-size:17px}
.list button.cur{border-color:var(--blue)}.list button.done{opacity:.45}
.big{font-size:clamp(24px,6vw,34px);padding:clamp(22px,6vw,34px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{background:#7f1d1d;border-radius:10px;padding:12px;display:none}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-bottom:10px;align-items:end}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.acts .btn{padding:12px 20px;font-size:17px}
</style>
</head>
<body>
<div class="conn" id="conn">연결 끊김</div>
<div class="top">
  <div><div class="small">방 코드</div><div class="code" id="code">------</div></div>
  <div class="links"><button id="cpDisp">발표자 주소 복사</button><button id="cpMini">보조 주소 복사</button><button id="sndBtn">🔔 소리 켜짐</button><button id="setBtn">⚙ 설정</button></div>
</div>
<div class="err" id="err"></div>
<div class="slots" id="slots"></div>
<div class="now" id="now"><div><div class="small" id="nslot"></div><b id="nname">-</b></div><div class="t" id="ntime">--:--</div></div>
<div class="list" id="list"></div>
<div class="two"><button class="btn amber" id="pause">일시정지</button><button class="btn" id="reset">리셋</button></div>
<div class="small" id="diag" style="text-align:center"></div>
<button class="btn go big" id="next">시작</button>

<div class="modal" id="modal"><div class="sheet">
  <h2 style="margin-bottom:10px">설정</h2>
  <label>발표자 명단 (한 줄에 한 명)</label>
  <textarea id="plist" rows="6"></textarea>
  <div style="height:12px"></div>
  <div id="rows"></div>
  <label>벨소리</label>
  <select id="bellSel"><option value="0">1. 차임</option><option value="1">2. 징</option><option value="2">3. 디지털</option><option value="3">4. 부저</option></select>
  <div class="acts"><button class="btn" id="cancel">취소</button><button class="btn go" id="save">저장</button></div>
</div></div>

<script type="module">
import { login, syncClock, watchRoom, patchRoom, startedStamp, remaining, serverNow, clockOffset } from './fb.js';
import { fmt, esc, unlock, beep, ring, stopRing, vib, wakeLock, audioState } from './audio.js';
const $ = id => document.getElementById(id);
const code = (new URLSearchParams(location.search).get('room') || '').replace(/\D/g, '');
let belledKey = '', warned = false, soundOn = true, prevRem = 0;
try { soundOn = localStorage.getItem('multitimer.sound') !== '0'; } catch (e) {}
let room = null, uid = null, fromCache = false, offSince = 0;
const fail = m => { $('err').style.display = 'block'; $('err').textContent = m; };

if (!/^\d{6}$/.test(code)) fail('방 코드가 없습니다. 첫 화면에서 "새 방 만들기"를 누르세요.');
else init();

async function init() {
  $('code').textContent = code;
  try {
    uid = (await login()).uid;
    syncClock().catch(() => {}); setInterval(() => syncClock().catch(() => {}), 5 * 60 * 1000);
    watchRoom(code, (r, meta) => {
      fromCache = meta.fromCache;
      if (r === null) { if (!meta.fromCache) fail('방을 찾을 수 없습니다 (' + code + ')'); return; }
      room = r;
      if (r.ownerUid !== uid) fail('이 기기는 이 방의 운영자가 아닙니다. 보기만 가능하고 버튼은 동작하지 않습니다.');
      else $('err').style.display = 'none';
      renderStatic();
    }, e => fail('연결 오류: ' + (e.code || e.message)));
  } catch (e) { fail('로그인 실패: ' + (e.code || e.message) + ' (Firebase 익명 로그인 설정 확인)'); }
  requestAnimationFrame(loop);
}

const mine = () => room && room.ownerUid === uid;
const write = p => mine() ? patchRoom(code, p).catch(e => fail('저장 실패: ' + (e.code || e.message))) : null;

function renderStatic() {
  $('slots').innerHTML = room.slots.map((s, i) => `<button data-i="${i}" class="${i === room.slotIndex ? 'on' : ''}">${esc(s.name)}</button>`).join('');
  $('list').innerHTML = room.presenters.length
    ? room.presenters.map((n, i) => `<button data-i="${i}" class="${i === room.presenterIndex ? 'cur' : ''} ${i < room.presenterIndex ? 'done' : ''}"><span>${i + 1}. ${esc(n)}</span><span>${i === room.presenterIndex ? (room.status === 'idle' ? '대기' : '발표 중') : i < room.presenterIndex ? '완료' : ''}</span></button>`).join('')
    : '<div class="small">⚙ 설정에서 발표자 명단을 입력하세요.</div>';
  const last = room.presenterIndex >= room.presenters.length - 1;
  $('next').textContent = room.status === 'idle' ? '시작 · ' + (room.presenters[room.presenterIndex] || '') : last ? '마지막 발표자입니다' : '다음 사람 시작';
  $('next').disabled = room.status !== 'idle' && last;
  $('pause').textContent = room.status === 'paused' ? '계속' : '일시정지';
  $('pause').disabled = room.status === 'idle';
  $('nslot').textContent = room.slots[room.slotIndex].name;
  $('nname').textContent = room.presenters[room.presenterIndex] || '-';
}

function loop() {
  requestAnimationFrame(loop);
  const online = navigator.onLine && !fromCache;
  if (online) offSince = 0; else if (!offSince) offSince = Date.now();
  $('conn').classList.toggle('show', !!offSince && Date.now() - offSince > 2000);
  if (!room) return;
  const rem = remaining(room), sl = room.slots[room.slotIndex], run = room.status === 'running';
  const key = room.startedMs + ':' + room.presenterIndex;
  if (run && rem <= 0 && belledKey !== key) { belledKey = key; if ((prevRem > 0 || -rem < 3) && soundOn) { ring(room.bell); vib(); } }
  prevRem = run ? rem : 0;
  $('diag').textContent = '소리: ' + audioState() + ' · 시계 오차: ' + Math.round(clockOffset()) + 'ms';
  if (!run) { belledKey = ''; stopRing(); }
  const warnNow = run && rem > 0 && sl.flagSec > 0 && rem <= sl.flagSec;
  if (warnNow && !warned && soundOn) beep(.15, 880);
  warned = warnNow;
  $('ntime').textContent = fmt(rem);
  $('now').classList.toggle('bell', run && rem <= 0);
  $('now').classList.toggle('warn', run && rem > 0 && sl.flagSec > 0 && rem <= sl.flagSec);
}

/* 소리: 첫 터치에서 오디오를 풀고, 화면 꺼짐을 막는다 (폰이 잠들면 벨이 안 울림) */
const paintSnd = () => $('sndBtn').textContent = soundOn ? '🔔 소리 켜짐' : '🔕 소리 꺼짐';
paintSnd();
document.addEventListener('pointerdown', () => { unlock(); wakeLock(true); }, { once: true });
$('sndBtn').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('multitimer.sound', soundOn ? '1' : '0'); } catch (e) {} if (!soundOn) stopRing(); paintSnd(); };

/* 조작 */
$('slots').onclick = e => { const b = e.target.closest('button'); if (!b || !room) return;
  write({ slotIndex: +b.dataset.i, status: 'idle', startedAt: null, runSec: 0, pausedRemainingSec: 0 }); };
$('list').onclick = e => { const b = e.target.closest('button'); if (!b || !room) return;
  write({ presenterIndex: +b.dataset.i, status: 'idle', startedAt: null, runSec: 0, pausedRemainingSec: 0 }); };
$('next').onclick = () => {
  if (!room) return;
  const idx = room.status === 'idle' ? room.presenterIndex : room.presenterIndex + 1;
  if (idx >= room.presenters.length && room.presenters.length) return;
  const total = room.slots[room.slotIndex].totalSec;
  write({ presenterIndex: idx, status: 'running', startedAt: startedStamp(), runSec: total, pausedRemainingSec: total });
};
$('pause').onclick = () => {
  if (!room) return;
  if (room.status === 'running') write({ status: 'paused', pausedRemainingSec: Math.max(0, Math.round(remaining(room) * 10) / 10), startedAt: null });
  else if (room.status === 'paused') write({ status: 'running', startedAt: startedStamp(), runSec: room.pausedRemainingSec });
};
$('reset').onclick = () => room && write({ status: 'idle', startedAt: null, runSec: 0, pausedRemainingSec: 0 });

/* 주소 복사 */
const base = location.href.replace(/control\.html.*$/, '');
function copy(text, btn) {
  const old = btn.textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => btn.textContent = '복사됨', () => prompt('주소를 복사하세요', text)).finally(() => setTimeout(() => btn.textContent = old, 1500));
}
$('cpDisp').onclick = e => copy(base + 'display.html?room=' + code, e.target);
$('cpMini').onclick = e => copy(base + 'display.html?mini=1&room=' + code, e.target);

/* 설정 */
$('setBtn').onclick = () => {
  if (!room || !mine()) return;
  $('plist').value = room.presenters.join('\n');
  $('rows').innerHTML = room.slots.map((s, i) => `<div class="row">
    <div><label>슬롯 ${i + 1} 이름</label><input data-k="name" data-i="${i}" maxlength="12" value="${esc(s.name)}"></div>
    <div><label>총 시간(초)</label><input data-k="totalSec" data-i="${i}" type="number" inputmode="numeric" value="${s.totalSec}"></div>
    <div><label>경고(남은 초)</label><input data-k="flagSec" data-i="${i}" type="number" inputmode="numeric" value="${s.flagSec}"></div></div>`).join('');
  $('bellSel').value = room.bell; $('modal').classList.add('show');
};
$('cancel').onclick = () => $('modal').classList.remove('show');
$('save').onclick = () => {
  const slots = room.slots.map(s => ({ ...s }));
  document.querySelectorAll('#rows input').forEach(el => {
    const s = slots[+el.dataset.i], k = el.dataset.k;
    if (k === 'name') s.name = el.value.trim() || s.name; else s[k] = Math.max(0, Math.round(+el.value) || 0);
  });
  slots.forEach(s => { s.totalSec = Math.min(7200, Math.max(5, s.totalSec)); s.flagSec = Math.min(s.flagSec, s.totalSec - 1); });
  const presenters = $('plist').value.split('\n').map(t => t.trim()).filter(Boolean).slice(0, 60);
  write({ slots, presenters, bell: +$('bellSel').value, presenterIndex: Math.min(room.presenterIndex, Math.max(0, presenters.length - 1)), status: 'idle', startedAt: null, runSec: 0, pausedRemainingSec: 0 });
  $('modal').classList.remove('show');
};
</script>
</body>
</html>
