<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멀티타이머</title>
<meta property="og:title" content="멀티타이머">
<meta property="og:description" content="스톱워치, 타이머, 반복 루틴, 여러 사람 발표 타이머를 한 앱에서.">
<meta property="og:image" content="https://jinjjabg-hub.github.io/multi-timer/og-image.png">
<meta property="og:url" content="https://jinjjabg-hub.github.io/multi-timer/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jinjjabg-hub.github.io/multi-timer/og-image.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="멀티타이머">
<style>
/* 밝은 카드형 UI + 하단 탭. 포인트: 블루(진행), 앰버(경고/휴식) */
:root{
  --bg:#f6f7fb;--card:#fff;--ink:#121a2d;--sub:#5b6880;--line:#e4e8f1;--chip:#e9eefb;
  --blue:#2f6bff;--blue-ink:#fff;--amber:#e08a00;--red:#d92d20;
  --t-orange:#ffe9e0;--t-blue:#e3ebff;--t-green:#dff7ec;--t-teal:#d9f6f3;--t-violet:#ece6ff;--t-gray:#eceff5;
  --i-orange:#e8541a;--i-blue:#2f6bff;--i-green:#12915a;--i-teal:#0f8f86;--i-violet:#6b4fd8;--i-gray:#4a5a78;
  --shadow:0 2px 10px rgba(20,30,60,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020;--card:#141c33;--ink:#eaf0ff;--sub:#93a3c4;--line:#243052;--chip:#1c2748;
  --blue:#5b8cff;--amber:#f5a524;--red:#ff6b5e;
  --t-orange:#3a2118;--t-blue:#1b2a52;--t-green:#12301f;--t-teal:#10302e;--t-violet:#2a2150;--t-gray:#1d2540;
  --i-orange:#ff8a5c;--i-blue:#7fa3ff;--i-green:#4fd39a;--i-teal:#4fd4c8;--i-violet:#a28cff;--i-gray:#9fb0d0;--shadow:none}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;font-size:16px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
svg.i.f{fill:currentColor;stroke:none}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px}h2{font-size:18px;display:flex;align-items:center;gap:8px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--chip);color:var(--blue)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:700;font-size:17px;text-align:center}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.warn{background:var(--amber);border-color:var(--amber);color:#1a1300}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);color:var(--blue);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
.chip.on{background:var(--blue);color:var(--blue-ink)}

/* 하단 탭 */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{display:flex;width:100%;max-width:640px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;font-size:12px;color:var(--sub);font-weight:600}
nav button svg{font-size:24px}
nav button.on{color:var(--blue)}
.page{display:none}.page.on{display:flex;flex-direction:column;gap:14px}

/* 큰 시간 */
.big{font-size:clamp(56px,17vw,110px);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.05}
.big small{font-size:.4em;font-weight:700;color:var(--sub)}

/* 프리셋 카드 */
.pcard{display:flex;gap:14px;align-items:center}
.tile{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px}
.tone-orange{background:var(--t-orange);color:var(--i-orange)}.tone-blue{background:var(--t-blue);color:var(--i-blue)}
.tone-green{background:var(--t-green);color:var(--i-green)}.tone-teal{background:var(--t-teal);color:var(--i-teal)}
.tone-violet{background:var(--t-violet);color:var(--i-violet)}.tone-gray{background:var(--t-gray);color:var(--i-gray)}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pbody b{font-size:17px}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.play{flex:none;width:46px;height:46px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-size:22px}
.edit{font-size:13px;color:var(--sub);padding:4px 6px}
.badge{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-left:6px}
.badge.best{background:var(--t-teal);color:var(--i-teal)}.badge.worst{background:var(--t-orange);color:var(--i-orange)}
.diff{font-size:13px;color:var(--sub)}.diff.up{color:var(--red)}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat2 b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
.wbars{display:flex;gap:8px;align-items:flex-end;height:140px;margin-top:12px}
.wbars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12px;color:var(--sub)}
.wbars .b{width:100%;border-radius:12px;background:var(--chip);min-height:4px}
.wbars .b.max{background:var(--blue)}.wbars .c.today{color:var(--ink);font-weight:700}
.up-t{color:var(--i-green)}.dn-t{color:var(--red)}
.addrow{display:flex;gap:8px;justify-content:center}
.recent{display:flex;align-items:center;gap:12px;padding:12px 14px}
.hero{background:linear-gradient(135deg,var(--t-blue),var(--card));}

/* 스톱워치 랩 */
.laps{display:flex;flex-direction:column}
.lap{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lap:last-child{border:0}

/* 실행 화면 */
.run{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.run.show{display:flex}
.run.rest{--blue:var(--amber)}
.run.end{background:var(--red);color:#fff}.run.end .sub{color:#ffe}
.ring{position:relative;width:min(78vw,60vh,420px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--blue);transition:stroke-dashoffset .2s linear}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ring .mid .big{font-size:clamp(48px,15vw,100px)}
.run .row{width:min(92vw,520px)}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:30;display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.sheet{background:var(--card);border-radius:20px;width:100%;max-width:460px;max-height:92dvh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{display:flex;gap:8px}.line .btn{white-space:nowrap}.line input{text-align:center;font-size:20px;letter-spacing:.15em}
.err{color:var(--red);font-size:14px;min-height:1.2em}
a.btn{display:block;text-decoration:none;color:inherit}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--blue)}.sw.on::after{left:23px}
</style>
</head>
<body>

<!-- 1. 스톱워치 -->
<main class="wrap page on" id="p-sw">
  <h1>스톱워치</h1>
  <div class="card"><div class="big" id="swTime">00:00<small>.00</small></div></div>
  <div class="row"><button class="btn" id="swLap" disabled>랩</button><button class="btn pri" id="swGo">시작</button><button class="btn" id="swReset">리셋</button></div>
  <div class="stat2" id="swStat" hidden></div>
  <div class="card laps" id="swLaps" hidden></div>
</main>

<!-- 2. 타이머 -->
<main class="wrap page" id="p-tm">
  <h1>타이머</h1>
  <div class="card"><div class="big" id="tmTime">05:00</div></div>
  <div class="chips" id="tmChips"></div>
  <div class="row"><button class="btn" data-a="-60">−1분</button><button class="btn" data-a="-10">−10초</button><button class="btn" data-a="10">+10초</button><button class="btn" data-a="60">+1분</button></div>
  <button class="btn pri" id="tmGo">시작</button>
  <h2 style="margin-top:6px">최근 타이머</h2>
  <div id="recent" style="display:flex;flex-direction:column;gap:10px"></div>
</main>

<!-- 3. 프리셋 -->
<main class="wrap page" id="p-ps">
  <h1>프리셋</h1>
  <div class="chips" id="cats"></div>
  <div id="plist" style="display:flex;flex-direction:column;gap:12px"></div>
  <button class="btn pri" id="newPs">＋ 새 프리셋 만들기</button>
</main>

<!-- 4. 발표 -->
<main class="wrap page" id="p-pt">
  <h1>발표 타이머</h1>
  <p class="sub">여러 사람이 순서대로 발표할 때 쓰는 모드. 운영자는 폰에서 "다음 사람"만 누릅니다.</p>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <h2>혼자 쓰기</h2><a class="btn pri" href="solo.html">단독 발표 타이머 열기</a>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <h2>운영자 (핸드폰)</h2>
    <button class="btn pri" id="newRoom">새 방 만들기</button>
    <div class="line"><input id="opCode" inputmode="numeric" maxlength="6" placeholder="기존 방 코드"><button class="btn" id="opJoin">입장</button></div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <h2>발표자 화면 (태블릿)</h2>
    <div class="line"><input id="dpCode" inputmode="numeric" maxlength="6" placeholder="방 코드"><button class="btn" id="dpJoin">입장</button></div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <h2>보조 화면 (PPT 옆 작은 창)</h2>
    <div class="line"><input id="miCode" inputmode="numeric" maxlength="6" placeholder="방 코드"><button class="btn" id="miJoin">입장</button></div>
  </div>
  <div class="err" id="ptErr"></div>
</main>

<!-- 5. 기록·설정 -->
<main class="wrap page" id="p-st">
  <h1>기록 · 설정</h1>
  <div class="card" id="week"></div>
  <div class="card">
    <div class="setrow"><span>소리</span><button class="sw" id="swSound" aria-label="소리"></button></div>
    <div class="setrow"><span>진동</span><button class="sw" id="swVib" aria-label="진동"></button></div>
    <div class="setrow"><span>시작 전 3·2·1 카운트다운</span><button class="sw" id="swCd" aria-label="카운트다운"></button></div>
    <div class="setrow"><span>벨소리</span>
      <div class="line" style="width:60%"><select id="bellSel"><option value="0">1. 차임</option><option value="1">2. 징</option><option value="2">3. 디지털</option><option value="3">4. 부저</option></select><button class="btn" id="bellPrev" style="padding:8px 12px">▶</button></div></div>
  </div>
  <div class="card"><h2>최근 기록</h2><div class="laps" id="hist" style="margin-top:8px"></div>
    <button class="btn danger" id="histClear" style="margin-top:10px" hidden>기록 지우기</button></div>
</main>

<nav><div class="in" id="nav"></div></nav>

<!-- 실행 화면 -->
<div class="run" id="run">
  <div class="sub" id="rName"></div>
  <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="rFg" cx="60" cy="60" r="54"/></svg>
    <div class="mid"><div class="pill" id="rLabel"></div><div class="big" id="rTime">00:00</div><div class="sub" id="rSet"></div></div></div>
  <div class="sub" id="rNext"></div>
  <div class="sub" id="rEnd"></div>
  <div class="addrow" id="rAdd"><button class="chip" data-add="60">+1분</button><button class="chip" data-add="300">+5분</button><button class="chip" data-add="600">+10분</button></div>
  <div class="row"><button class="btn warn" id="rPause">일시정지</button><button class="btn" id="rSkip">건너뛰기</button><button class="btn" id="rStop">종료</button></div>
</div>

<!-- 프리셋 편집 -->
<div class="modal" id="modal"><div class="sheet">
  <h2 id="mTitle">새 프리셋</h2>
  <div><label>이름</label><input id="fName" maxlength="20" placeholder="예: 스피치 연습"></div>
  <div><label>분류</label><select id="fCat"><option>발표</option><option>운동</option><option>공부</option><option>생활</option></select></div>
  <div class="g2"><div><label>집중 시간 (분)</label><input id="fWm" type="number" inputmode="numeric" min="0" value="25"></div><div><label>집중 시간 (초)</label><input id="fWs" type="number" inputmode="numeric" min="0" max="59" value="0"></div>
    <div><label>휴식 시간 (분)</label><input id="fRm" type="number" inputmode="numeric" min="0" value="5"></div><div><label>휴식 시간 (초)</label><input id="fRs" type="number" inputmode="numeric" min="0" max="59" value="0"></div></div>
  <div><label>세트 수</label><input id="fSets" type="number" inputmode="numeric" min="1" max="99" value="4"></div>
  <div class="err" id="fErr"></div>
  <div class="row"><button class="btn" id="fCancel">취소</button><button class="btn danger" id="fDel" hidden>삭제</button><button class="btn pri" id="fSave">저장</button></div>
</div></div>

<script type="module">
import { unlock, beep, playBell, ring, stopRing, vib, wakeLock, esc } from './audio.js';
const $ = id => document.getElementById(id);
const KEY = 'multitimer.app.v1';
let S = { sound: true, vib: true, cd: true, bell: 0, tmSec: 300, presets: [], hist: [], recent: [] };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- 아이콘 ---------- */
const P = {
  stopwatch: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/>',
  timer: '<path d="M6 2h12M6 22h12M7 2v4l5 6-5 6v4M17 2v4l-5 6 5 6v4"/>',
  preset: '<path d="M6 3h12v18l-6-4-6 4z"/>',
  mic: '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
  clock: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
  flame: '<path d="M12 22c4 0 7-3 7-7 0-3-2-5-3-7-1 2-2 3-3 3 0-3-1-6-4-8 0 4-4 6-4 12 0 4 3 7 7 7z"/>',
  bowl: '<path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/>',
  wind: '<path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/>',
  moon: '<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>',
  book: '<path d="M4 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H4zM20 4h-6M20 4v15h-6"/>',
  play: '<path d="M8 5v14l11-7z"/>'
};
const ico = (n, fill) => `<svg class="i ${fill ? 'f' : ''}" viewBox="0 0 24 24">${P[n]}</svg>`;

/* ---------- 탭 ---------- */
const TABS = [['sw', '스톱워치', 'stopwatch'], ['tm', '타이머', 'timer'], ['ps', '프리셋', 'preset'], ['pt', '발표', 'mic'], ['st', '기록·설정', 'gear']];
$('nav').innerHTML = TABS.map(([k, l, i]) => `<button data-k="${k}">${ico(i)}<span>${l}</span></button>`).join('');
function tab(k) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + k));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  if (k === 'st') renderHist();
  window.scrollTo(0, 0);
}
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) tab(b.dataset.k); };
tab(new URLSearchParams(location.search).get('tab') || 'sw');

const pad = n => String(n).padStart(2, '0');
const mmss = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600); return (h ? h + ':' + pad(Math.floor(s % 3600 / 60)) : pad(Math.floor(s / 60))) + ':' + pad(s % 60); };
const dur = s => { const m = Math.floor(s / 60), r = s % 60; return (m ? m + '분' : '') + (m && r ? ' ' : '') + (r ? r + '초' : '') || '0초'; };

/* ---------- 소리/진동 (설정 반영) ---------- */
const bp = (d, f) => S.sound && beep(d, f);
const doRing = () => { if (S.sound) ring(S.bell); if (S.vib) vib(); };

/* ---------- 1. 스톱워치 ---------- */
let sw = { run: false, base: 0, acc: 0, laps: [], lastLap: 0 }, swRaf = 0;
const swNow = () => sw.acc + (sw.run ? performance.now() - sw.base : 0);
const fmtSw = ms => { const t = Math.floor(ms / 10), c = t % 100, s = Math.floor(t / 100); return `${mmss(s).replace(/^(\d+:\d+).*/, '$1')}`.replace(/^/, '') + '.' + pad(c); };
function swFmtParts(ms) { const t = Math.floor(ms / 10); const s = Math.floor(t / 100); const m = Math.floor(s / 60); return pad(m) + ':' + pad(s % 60) + '<small>.' + pad(t % 100) + '</small>'; }
function swPaint() { $('swTime').innerHTML = swFmtParts(swNow()); if (sw.run) swRaf = requestAnimationFrame(swPaint); }
$('swGo').onclick = () => {
  if (sw.run) { sw.acc = swNow(); sw.run = false; cancelAnimationFrame(swRaf); wakeLock(false); }
  else { sw.base = performance.now(); sw.run = true; wakeLock(true); swPaint(); }
  $('swGo').textContent = sw.run ? '정지' : '계속'; $('swGo').className = 'btn ' + (sw.run ? 'warn' : 'pri'); $('swLap').disabled = !sw.run; swPaint();
};
$('swLap').onclick = () => { const n = swNow(); sw.laps.unshift({ lap: n - sw.lastLap, total: n }); sw.lastLap = n; renderLaps(); };
$('swReset').onclick = () => { sw = { run: false, base: 0, acc: 0, laps: [], lastLap: 0 }; cancelAnimationFrame(swRaf); wakeLock(false); $('swGo').textContent = '시작'; $('swGo').className = 'btn pri'; $('swLap').disabled = true; renderLaps(); swPaint(); };
const plain = ms => { const t = Math.floor(ms / 10); return pad(Math.floor(t / 6000)) + ':' + pad(Math.floor(t / 100) % 60) + '.' + pad(t % 100); };
function renderLaps() {
  const L = sw.laps;
  $('swLaps').hidden = $('swStat').hidden = !L.length;
  if (!L.length) return;
  const min = Math.min(...L.map(l => l.lap)), max = Math.max(...L.map(l => l.lap)), avg = L.reduce((a, l) => a + l.lap, 0) / L.length;
  $('swStat').innerHTML = `<div class="card"><span class="sub">평균 랩타임</span><b>${plain(avg)}</b></div><div class="card"><span class="sub">최고 랩</span><b>${plain(min)}</b></div>`;
  $('swLaps').innerHTML = L.map((l, i) => {
    const prev = L[i + 1], d = prev ? l.lap - prev.lap : null;
    const badge = L.length > 1 && l.lap === min ? '<span class="badge best">최고 랩</span>' : L.length > 1 && l.lap === max ? '<span class="badge worst">최저 랩</span>' : '';
    const dd = d === null ? '' : `<span class="diff ${d > 0 ? 'up' : ''}">${d > 0 ? '+' : '−'}${(Math.abs(d) / 1000).toFixed(2)}s</span>`;
    return `<div class="lap"><span>랩 ${L.length - i}${badge}</span>${dd}<b>${plain(l.lap)}</b></div>`;
  }).join('');
}

/* ---------- 2. 타이머 ---------- */
const QUICK = [60, 180, 300, 600, 900, 1800];
function tmPaint() {
  $('tmTime').textContent = mmss(S.tmSec);
  renderRecent();
  $('tmChips').innerHTML = QUICK.map(q => `<button class="chip ${q === S.tmSec ? 'on' : ''}" data-s="${q}">${dur(q)}</button>`).join('');
}
$('tmChips').onclick = e => { const b = e.target.closest('[data-s]'); if (b) { S.tmSec = +b.dataset.s; save(); tmPaint(); } };
document.querySelectorAll('#p-tm [data-a]').forEach(b => b.onclick = () => { S.tmSec = Math.min(86399, Math.max(5, S.tmSec + +b.dataset.a)); save(); tmPaint(); });
$('tmGo').onclick = () => startTimer(S.tmSec);
function startTimer(sec) { S.tmSec = sec; openRun('타이머 ' + dur(sec), [{ label: '타이머', sec, cycle: 0 }], 1, { k: 'tm' + sec, t: 'tm', sec, name: '타이머 ' + dur(sec) }); tmPaint(); }
function renderRecent() {
  $('recent').innerHTML = S.recent.length ? S.recent.map((r, i) => `<div class="card recent"><div class="tile tone-gray">${ico('clock')}</div><div class="pbody"><b>${esc(r.name)}</b><span class="sub">${dur(r.total)}</span></div><button class="play" data-r="${i}" aria-label="다시 시작">${ico('play', 1)}</button></div>`).join('') : '<p class="sub">시작한 타이머가 여기에 모입니다.</p>';
}
$('recent').onclick = e => {
  const b = e.target.closest('[data-r]'); if (!b) return;
  const r = S.recent[+b.dataset.r];
  if (r.t === 'tm') startTimer(r.sec);
  else { const p = allPresets().find(x => x.id === r.id); if (p) openRun(p.name, phasesOf(p), p.sets, { k: 'ps' + p.id, t: 'ps', id: p.id, name: p.name }); }
};
tmPaint();

/* ---------- 3. 프리셋 ---------- */
const BUILTIN = [
  { id: 'pt3', name: '발표 3분', tag: '발표', cat: '발표', icon: 'mic', tone: 'blue', steps: [{ label: '발표', sec: 180 }], sets: 1, desc: '짧은 자기소개·피치' },
  { id: 'pt5', name: '발표 5분', cat: '발표', icon: 'mic', tone: 'blue', steps: [{ label: '발표', sec: 300 }], sets: 1, desc: '일반 발표' },
  { id: 'qa', name: '발표 8분 + 질의 2분', cat: '발표', icon: 'mic', tone: 'violet', steps: [{ label: '발표', sec: 480 }, { label: '질의응답', sec: 120 }], sets: 1, desc: '발표 후 질의응답' },
  { id: 'pomo', name: '뽀모도로 포커스', tag: '인기', cat: '공부', icon: 'book', tone: 'orange', steps: [{ label: '집중', sec: 1500 }, { label: '휴식', sec: 300, rest: 1 }], sets: 4, desc: '25분 집중 + 5분 휴식' },
  { id: 'tabata', name: '타바타 고강도 인터벌', tag: 'HIIT', cat: '운동', icon: 'flame', tone: 'blue', steps: [{ label: '운동', sec: 20 }, { label: '휴식', sec: 10, rest: 1 }], sets: 8, desc: '20초 운동 / 10초 휴식' },
  { id: 'ramen', name: '퍼펙트 라면 타이머', tag: '꿀팁', cat: '생활', icon: 'bowl', tone: 'green', steps: [{ label: '끓이기', sec: 210 }], sets: 1, desc: '끓는 물 투하 후 3분 30초' },
  { id: '478', name: '4-7-8 호흡 이완', tag: '마인드풀', cat: '생활', icon: 'wind', tone: 'teal', steps: [{ label: '들이쉬기', sec: 4 }, { label: '멈추기', sec: 7 }, { label: '내쉬기', sec: 8 }], sets: 4, desc: '4초 들숨 · 7초 멈춤 · 8초 날숨' },
  { id: 'nap', name: '파워 낮잠', tag: '리프레시', cat: '생활', icon: 'moon', tone: 'violet', steps: [{ label: '낮잠', sec: 1200 }], sets: 1, desc: '수면 관성 없는 20분 회복' }
];
let cat = '전체', editing = null;
const CATS = ['전체', '발표', '운동', '공부', '생활'];
const allPresets = () => [...S.presets.map(p => ({ ...p, mine: true })), ...BUILTIN];
function phasesOf(p) {
  const out = [];
  for (let c = 0; c < p.sets; c++) p.steps.forEach(s => out.push({ label: s.label, sec: s.sec, rest: !!s.rest, cycle: c }));
  if (out.length && out[out.length - 1].rest) out.pop();
  return out;
}
function renderPresets() {
  $('cats').innerHTML = CATS.map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-c="${c}">${c}</button>`).join('');
  const list = allPresets().filter(p => cat === '전체' || p.cat === cat);
  $('plist').innerHTML = list.map(p => {
    const ph = phasesOf(p), total = ph.reduce((a, b) => a + b.sec, 0);
    return `<div class="card pcard"><div class="tile tone-${p.tone || 'gray'}">${ico(p.icon || 'clock')}</div>
      <div class="pbody"><div><b>${esc(p.name)}</b> ${p.tag ? `<span class="pill">${esc(p.tag)}</span>` : ''}${p.mine ? '<span class="pill">내 루틴</span>' : ''}</div>
      <div class="sub">${esc(p.desc || '')}</div>
      <div class="meta"><span>${p.sets}세트</span><span>총 ${dur(total)}</span><span>${esc(p.cat)}</span>${p.mine ? `<button class="edit" data-e="${p.id}">편집</button>` : ''}</div></div>
      <button class="play" data-p="${p.id}" aria-label="시작">${ico('play', 1)}</button></div>`;
  }).join('') || '<p class="sub">이 분류에는 프리셋이 없습니다.</p>';
}
$('cats').onclick = e => { const b = e.target.closest('[data-c]'); if (b) { cat = b.dataset.c; renderPresets(); } };
$('plist').onclick = e => {
  const pl = e.target.closest('[data-p]'), ed = e.target.closest('[data-e]');
  if (pl) { const p = allPresets().find(x => x.id === pl.dataset.p); openRun(p.name, phasesOf(p), p.sets, { k: 'ps' + p.id, t: 'ps', id: p.id, name: p.name }); }
  if (ed) openEditor(S.presets.find(x => x.id === ed.dataset.e));
};
renderPresets();

/* 프리셋 편집 */
function openEditor(p) {
  editing = p || null; $('mTitle').textContent = p ? '프리셋 편집' : '새 프리셋';
  const w = p ? p.steps[0].sec : 1500, r = p && p.steps[1] ? p.steps[1].sec : 0;
  $('fName').value = p ? p.name : ''; $('fCat').value = p ? p.cat : '공부';
  $('fWm').value = Math.floor(w / 60); $('fWs').value = w % 60; $('fRm').value = Math.floor(r / 60); $('fRs').value = r % 60; $('fSets').value = p ? p.sets : 4;
  $('fDel').hidden = !p; $('fErr').textContent = ''; $('modal').classList.add('show');
}
$('newPs').onclick = () => openEditor(null);
$('fCancel').onclick = () => $('modal').classList.remove('show');
$('fDel').onclick = () => { S.presets = S.presets.filter(x => x !== editing); save(); renderPresets(); $('modal').classList.remove('show'); };
$('fSave').onclick = () => {
  const n = id => Math.max(0, Math.round(+$(id).value) || 0);
  const w = n('fWm') * 60 + n('fWs'), r = n('fRm') * 60 + n('fRs'), sets = Math.min(99, Math.max(1, n('fSets')));
  const name = $('fName').value.trim();
  if (!name) return $('fErr').textContent = '이름을 입력하세요.';
  if (w < 1) return $('fErr').textContent = '집중 시간은 1초 이상이어야 합니다.';
  const steps = [{ label: '집중', sec: w }]; if (r) steps.push({ label: '휴식', sec: r, rest: 1 });
  const p = { id: editing ? editing.id : 'u' + Date.now(), name, cat: $('fCat').value, icon: 'clock', tone: 'gray', steps, sets, desc: dur(w) + (r ? ' 집중 + ' + dur(r) + ' 휴식' : '') };
  if (editing) S.presets[S.presets.indexOf(editing)] = p; else S.presets.unshift(p);
  save(); renderPresets(); $('modal').classList.remove('show');
};

/* ---------- 실행 엔진 (타이머·프리셋 공용) ---------- */
let R = null;
const ticker = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),100)'])));
ticker.onmessage = () => R && runTick();
const CIRC = 2 * Math.PI * 54; $('rFg').style.strokeDasharray = CIRC;
function openRun(name, phases, sets, src) {
  unlock(); wakeLock(true);
  const total = phases.reduce((a, b) => a + b.sec, 0);
  if (src) { S.recent = [{ ...src, total }, ...S.recent.filter(r => r.k !== src.k)].slice(0, 3); save(); renderRecent(); }
  if (S.cd) phases = [{ label: '준비', sec: 3, cycle: 0, pre: true }, ...phases];
  R = { name, phases, sets, i: 0, paused: false, done: false, left: 0, endAt: 0, lastBeep: -1, t0: Date.now() };
  begin(0); $('run').classList.add('show'); runTick();
}
function begin(i) { R.i = i; R.endAt = Date.now() + R.phases[i].sec * 1000; R.lastBeep = -1; }
const leftSec = () => R.paused ? R.left : Math.max(0, (R.endAt - Date.now()) / 1000);
function runTick() {
  if (R.done) return paintRun();
  const l = leftSec();
  if (!R.paused) {
    const c = Math.ceil(l);
    if (c <= 3 && c >= 1 && c !== R.lastBeep && (R.phases[R.i].sec > 5 || R.phases[R.i].pre)) { R.lastBeep = c; bp(.1, 700); }
    if (l <= 0) { if (R.i + 1 < R.phases.length) { bp(.25, 988); if (S.vib) try { navigator.vibrate && navigator.vibrate(200); } catch (e) {} begin(R.i + 1); } else return finish(); }
  }
  paintRun();
}
function paintRun() {
  const ph = R.phases[R.i], l = R.done ? 0 : leftSec(), nx = R.phases[R.i + 1];
  $('run').classList.toggle('rest', !!ph.rest && !R.done);
  $('rName').textContent = R.name;
  $('rLabel').textContent = R.done ? '완료' : ph.label;
  $('rTime').textContent = R.done ? '00:00' : mmss(l);
  $('rSet').textContent = R.sets > 1 && !ph.pre ? `세트 ${ph.cycle + 1} / ${R.sets}` : '';
  const real = R.phases.filter(p => !p.pre), tot = real.reduce((a, p) => a + p.sec, 0);
  const doneSec = R.done ? tot : real.reduce((a, p, k) => a + (R.phases.indexOf(p) < R.i ? p.sec : 0), 0) + (ph.pre ? 0 : ph.sec - l);
  const pct = tot ? Math.round(Math.min(1, doneSec / tot) * 100) : 0;
  if (!ph.pre && !R.done) $('rLabel').textContent = ph.label + ' · ' + pct + '%';
  const remain = R.phases.slice(R.i + 1).reduce((a, p) => a + p.sec, 0) + l;
  const endT = new Date(Date.now() + remain * 1000);
  $('rEnd').textContent = R.done ? '' : R.paused ? '일시정지 중' : '종료 예정 ' + pad(endT.getHours()) + ':' + pad(endT.getMinutes());
  $('rAdd').hidden = R.done || ph.pre;
  $('rNext').textContent = R.done ? '수고하셨습니다' : nx ? `다음: ${nx.label} ${mmss(nx.sec)}` : '마지막 구간';
  $('rFg').style.strokeDashoffset = CIRC * (1 - (R.done ? 0 : l / ph.sec));
  $('rPause').textContent = R.paused ? '계속' : '일시정지';
  $('rPause').hidden = $('rSkip').hidden = R.done; $('rStop').textContent = R.done ? '닫기' : '종료';
  $('run').classList.toggle('end', R.done);
}
function finish() {
  R.done = true; doRing();
  S.hist.unshift({ name: R.name, sec: R.phases.filter(p => !p.pre).reduce((a, p) => a + p.sec, 0), at: Date.now() }); S.hist = S.hist.slice(0, 300); save();
  paintRun();
}
$('rPause').onclick = () => { if (R.paused) { R.endAt = Date.now() + R.left * 1000; R.paused = false; } else { R.left = leftSec(); R.paused = true; } paintRun(); };
$('rSkip').onclick = () => { if (R.i + 1 < R.phases.length) begin(R.i + 1); else finish(); paintRun(); };
$('rAdd').onclick = e => {
  const b = e.target.closest('[data-add]'); if (!b || !R || R.done) return;
  const n = +b.dataset.add, ph = R.phases[R.i]; ph.sec += n; R.lastBeep = -1;
  if (R.paused) R.left += n; else R.endAt += n * 1000; paintRun();
};
$('rStop').onclick = () => { stopRing(); wakeLock(false); $('run').classList.remove('show', 'end'); R = null; };

/* ---------- 5. 기록·설정 ---------- */
function paintSet() {
  $('swCd').classList.toggle('on', S.cd); $('swSound').classList.toggle('on', S.sound); $('swVib').classList.toggle('on', S.vib); $('bellSel').value = S.bell;
}
$('swCd').onclick = () => { S.cd = !S.cd; save(); paintSet(); };
$('swSound').onclick = () => { S.sound = !S.sound; save(); paintSet(); };
$('swVib').onclick = () => { S.vib = !S.vib; save(); paintSet(); };
$('bellSel').onchange = () => { S.bell = +$('bellSel').value; save(); };
$('bellPrev').onclick = () => playBell(+$('bellSel').value);
function renderWeek() {
  const day = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(), t0 = day(new Date()), D = 864e5;
  const sum = (from, to) => S.hist.filter(h => h.at >= from && h.at < to);
  const cur = sum(t0 - 6 * D, t0 + D), prev = sum(t0 - 13 * D, t0 - 6 * D);
  const mins = a => a.reduce((x, h) => x + h.sec, 0) / 60;
  const days = [...Array(7)].map((_, i) => { const st = t0 - (6 - i) * D; return { d: new Date(st), m: mins(sum(st, st + D)) }; });
  const mx = Math.max(1, ...days.map(x => x.m)), tot = mins(cur), pt = mins(prev);
  const diff = pt > 0 ? Math.round((tot - pt) / pt * 100) : null;
  const W = '일월화수목금토';
  $('week').innerHTML = `<h2>주간 활동 요약 <span class="sub" style="font-weight:400;font-size:13px">최근 7일</span></h2>
    <div class="stat2" style="margin-top:10px"><div><span class="sub">총 측정 시간</span><b>${Math.floor(tot / 60)}시간 ${Math.round(tot % 60)}분</b>${diff === null ? '' : `<span class="${diff >= 0 ? 'up-t' : 'dn-t'}" style="font-size:13px">전주 대비 ${diff >= 0 ? '+' : ''}${diff}%</span>`}</div>
    <div><span class="sub">완료한 타이머</span><b>${cur.length}회</b></div></div>
    <div class="wbars">${days.map((x, i) => `<div class="c ${i === 6 ? 'today' : ''}"><span>${Math.round(x.m)}</span><div class="b ${x.m === mx && x.m > 0 ? 'max' : ''}" style="height:${Math.max(3, x.m / mx * 100)}px"></div><span>${i === 6 ? '오늘' : W[x.d.getDay()]}</span></div>`).join('')}</div>`;
}
function renderHist() {
  renderWeek();
  $('hist').innerHTML = S.hist.length ? S.hist.slice(0, 20).map(h => { const d = new Date(h.at); return `<div class="lap"><span>${esc(h.name)}</span><span>${dur(h.sec)}</span><span class="sub">${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}</span></div>`; }).join('') : '<p class="sub">아직 완료한 기록이 없습니다.</p>';
  $('histClear').hidden = !S.hist.length;
}
$('histClear').onclick = () => { S.hist = []; save(); renderHist(); };
paintSet();

/* ---------- 4. 발표 (방 코드) ---------- */
const LAST = 'multitimer.lastRoom';
let last = ''; try { last = localStorage.getItem(LAST) || ''; } catch (e) {}
['opCode', 'dpCode', 'miCode'].forEach(id => { $(id).value = last; });
const val = id => { const c = $(id).value.replace(/\D/g, ''); if (c.length !== 6) { $('ptErr').textContent = '방 코드는 숫자 6자리입니다.'; return null; } try { localStorage.setItem(LAST, c); } catch (e) {} return c; };
$('opJoin').onclick = () => { const c = val('opCode'); if (c) location.href = 'control.html?room=' + c; };
$('dpJoin').onclick = () => { const c = val('dpCode'); if (c) location.href = 'display.html?room=' + c; };
$('miJoin').onclick = () => { const c = val('miCode'); if (c) location.href = 'display.html?mini=1&room=' + c; };
$('newRoom').onclick = async () => {
  $('ptErr').textContent = '방 만드는 중…'; $('newRoom').disabled = true;
  try {
    const { createRoom } = await import('./fb.js');
    let s = null; try { s = JSON.parse(localStorage.getItem('multitimer.settings.v1')); } catch (e) {}
    const def = [['발표1', 180], ['발표2', 300], ['발표3', 480], ['발표4', 600]];
    const slots = def.map(([name, t], i) => { const o = s && s.slots && s.slots[i]; return { name: o ? String(o.name).slice(0, 12) : name, totalSec: o ? o.total : t, flagSec: o ? o.flag : 30 }; });
    const c = await createRoom({ slots, presenters: ['발표자 1', '발표자 2', '발표자 3'], bell: s && s.bell | 0 || 0 });
    try { localStorage.setItem(LAST, c); } catch (e) {}
    location.href = 'control.html?room=' + c;
  } catch (e) { $('ptErr').textContent = '실패: ' + (e.code || e.message) + ' (Firebase 콘솔 설정을 확인하세요)'; $('newRoom').disabled = false; }
};
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
