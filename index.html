<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멀티타이머</title>
<meta property="og:title" content="멀티타이머">
<meta property="og:description" content="여러 사람이 순서대로 발표할 때 쓰는 타이머. 운영자는 버튼 하나로 다음 사람 시작.">
<meta property="og:image" content="https://jinjjabg-hub.github.io/multi-timer/og-image.png">
<meta property="og:url" content="https://jinjjabg-hub.github.io/multi-timer/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jinjjabg-hub.github.io/multi-timer/og-image.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f1b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="멀티타이머">
<link rel="stylesheet" href="common.css">
<style>
body{padding:clamp(14px,4vw,28px);display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
h1{font-size:28px}.sub{color:var(--sub);font-size:14px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:18px}
.line{display:flex;gap:8px}
.line input{text-align:center;font-size:22px;letter-spacing:.2em}
.line .btn{padding:10px 18px;font-size:18px;white-space:nowrap}
a.btn{display:block;text-align:center;text-decoration:none;color:inherit}
.err{color:#ff8b8b;font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<div><h1>멀티타이머</h1><p class="sub">여러 사람이 순서대로 발표할 때 쓰는 타이머</p></div>

<div class="card">
  <h2>혼자 쓰기</h2>
  <a class="btn go" href="solo.html">단독 타이머 열기</a>
</div>

<div class="card">
  <h2>운영자 (핸드폰)</h2>
  <button class="btn go" id="newRoom">새 방 만들기</button>
  <div class="line"><input id="opCode" inputmode="numeric" maxlength="6" placeholder="기존 방 코드"><button class="btn" id="opJoin">입장</button></div>
</div>

<div class="card">
  <h2>발표자 화면 (태블릿)</h2>
  <div class="line"><input id="dpCode" inputmode="numeric" maxlength="6" placeholder="방 코드"><button class="btn" id="dpJoin">입장</button></div>
</div>

<div class="card">
  <h2>보조 화면 (PPT 옆 작은 창)</h2>
  <div class="line"><input id="miCode" inputmode="numeric" maxlength="6" placeholder="방 코드"><button class="btn" id="miJoin">입장</button></div>
</div>
<div class="err" id="err"></div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'multitimer.lastRoom';
let last = ''; try { last = localStorage.getItem(KEY) || ''; } catch (e) {}
['opCode', 'dpCode', 'miCode'].forEach(id => { $(id).value = last; });
const val = id => { const c = $(id).value.replace(/\D/g, ''); if (c.length !== 6) { $('err').textContent = '방 코드는 숫자 6자리입니다.'; return null; } try { localStorage.setItem(KEY, c); } catch (e) {} return c; };
$('opJoin').onclick = () => { const c = val('opCode'); if (c) location.href = 'control.html?room=' + c; };
$('dpJoin').onclick = () => { const c = val('dpCode'); if (c) location.href = 'display.html?room=' + c; };
$('miJoin').onclick = () => { const c = val('miCode'); if (c) location.href = 'display.html?mini=1&room=' + c; };
$('newRoom').onclick = async () => {
  $('err').textContent = '방 만드는 중…'; $('newRoom').disabled = true;
  try {
    const { createRoom } = await import('./fb.js');
    let s = null; try { s = JSON.parse(localStorage.getItem('multitimer.settings.v1')); } catch (e) {}
    const def = [['발표1', 180], ['발표2', 300], ['발표3', 480], ['발표4', 600]];
    const slots = def.map(([name, t], i) => { const o = s && s.slots && s.slots[i]; return { name: o ? String(o.name).slice(0, 12) : name, totalSec: o ? o.total : t, flagSec: o ? o.flag : 30 }; });
    const c = await createRoom({ slots, presenters: ['발표자 1', '발표자 2', '발표자 3'], bell: s && s.bell | 0 || 0 });
    try { localStorage.setItem(KEY, c); } catch (e) {}
    location.href = 'control.html?room=' + c;
  } catch (e) { $('err').textContent = '실패: ' + (e.code || e.message) + ' (Firebase 콘솔 설정을 확인하세요)'; $('newRoom').disabled = false; }
};
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
