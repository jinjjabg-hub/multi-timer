<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멀티타이머</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f1b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="멀티타이머">
<style>
:root{
  --bg:#0b1426; --panel:#13213d; --line:#243557; --text:#eef3fb; --sub:#8fa3c4;
  --blue:#3b82f6; --amber:#f5a524; --red:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;
  display:flex;flex-direction:column;min-height:100dvh;overflow-x:hidden;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* 상단: 슬롯 탭 */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(4px,1vw,10px);padding:clamp(8px,2vw,16px)}
.tab{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:clamp(8px,1.6vw,16px) 4px;
  font-size:clamp(14px,2.6vw,24px);font-weight:700;line-height:1.2;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab small{display:block;font-size:.7em;font-weight:500;color:var(--sub);margin-top:2px}
.tab.on{border-color:var(--blue);background:#1b3563}

/* 본문 */
.main{flex:1;display:flex;flex-direction:column;gap:clamp(8px,2vw,20px);padding:0 clamp(8px,2vw,16px) clamp(8px,2vw,16px)}
.stage{position:relative;flex:1;min-height:38vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--panel);border:2px solid var(--line);border-radius:20px;overflow:hidden;padding:12px}
.name{font-size:clamp(18px,4vw,40px);font-weight:700;color:var(--sub);margin-bottom:.2em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:clamp(72px,30vw,420px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.state{margin-top:.4em;font-size:clamp(14px,2.6vw,24px);color:var(--sub);height:1.4em}
.bar{position:absolute;left:0;bottom:0;height:8px;background:var(--blue);width:100%;transform-origin:left;transition:transform .25s linear}

/* 깃발 경고 */
.flag{position:absolute;top:10px;right:16px;font-size:clamp(40px,9vw,110px);line-height:1;display:none;transform-origin:50% 100%}
.stage.warn{animation:blink 1.2s ease-in-out infinite}
.stage.warn .flag{display:block;animation:swing .8s ease-in-out infinite}
.stage.warn .time{color:var(--amber)}
.stage.warn .bar{background:var(--amber)}
@keyframes swing{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@keyframes blink{0%,100%{background:var(--panel)}50%{background:#4a3410}}

/* 벨 알림 */
.stage.bell{background:var(--red);border-color:#ff6b6b}
.stage.bell .time,.stage.bell .name,.stage.bell .state{color:#fff}
.stage.bell .bar{background:#fff}

/* 버튼 */
.ctrl{display:grid;grid-template-columns:2fr 1fr;gap:clamp(8px,2vw,16px)}
.btn{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:clamp(14px,3vw,28px);
  font-size:clamp(18px,3.4vw,34px);font-weight:700}
.btn.go{background:var(--blue);border-color:var(--blue)}
.btn.go.pause{background:var(--amber);border-color:var(--amber);color:#1a1300}
.presets{display:none;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.6vw,12px)}
.presets.show{display:grid}
.presets .btn{padding:clamp(8px,1.6vw,16px);font-size:clamp(14px,2.6vw,24px)}
.presets .btn{white-space:nowrap}
.presets .btn.on{border-color:var(--amber);color:var(--amber)}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:13px}
.foot button{color:var(--sub);padding:8px 4px;font-size:15px}

/* 설정 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:18px;width:100%;max-width:560px;max-height:92dvh;overflow:auto;padding:18px;user-select:text}
.sheet h2{font-size:20px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-bottom:10px;align-items:end}
.row label,.bellrow label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px}
.bellrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin:14px 0}
.bellrow .btn{padding:10px 14px;font-size:16px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.acts .btn{padding:12px 20px;font-size:17px}

/* 태블릿 가로 2컬럼 */
@media (min-width:720px) and (orientation:landscape){
  .main{flex-direction:row;align-items:stretch}
  .stage{flex:2}
  .side{flex:1;display:flex;flex-direction:column;gap:clamp(8px,2vw,20px);justify-content:center}
  .ctrl{grid-template-columns:1fr}
  .presets{grid-template-columns:repeat(2,1fr)}
  .time{font-size:clamp(72px,19vw,420px)}
}
.side{display:flex;flex-direction:column;gap:clamp(8px,2vw,20px)}
@media (min-width:1024px){ .tab{font-size:26px} .time{font-size:clamp(120px,22vw,520px)} }
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>

<div class="main">
  <div class="stage" id="stage">
    <div class="flag">🚩</div>
    <div class="name" id="name"></div>
    <div class="time" id="time">00:00</div>
    <div class="state" id="state"></div>
    <div class="bar" id="bar"></div>
  </div>
  <div class="side">
    <div class="presets" id="presets"></div>
    <div class="ctrl">
      <button class="btn go" id="go">시작</button>
      <button class="btn" id="reset">리셋</button>
    </div>
    <div class="foot"><span id="wl"></span><button id="open">⚙ 설정</button></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>설정</h2>
    <div id="rows"></div>
    <div class="bellrow">
      <div><label>벨소리</label>
        <select id="bellSel"><option value="0">1. 차임</option><option value="1">2. 징</option><option value="2">3. 디지털</option><option value="3">4. 부저</option></select></div>
      <button class="btn" id="preview">▶ 미리듣기</button>
    </div>
    <div class="acts"><button class="btn" id="cancel">취소</button><button class="btn go" id="save">저장</button></div>
  </div>
</div>

<script>
(function(){
const KEY='multitimer.settings.v1';
const DEF={bell:0,slots:[
  {name:'발표1',total:180,flag:30},{name:'발표2',total:300,flag:30},
  {name:'발표3',total:480,flag:30},{name:'발표4',total:600,flag:30}]};
const PRESETS=[[30,'30초'],[40,'40초'],[50,'50초'],[60,'1분']];
const $=id=>document.getElementById(id);

let S=load(), cur=0;
let status='idle', endAt=0, pausedLeft=0, warned=false, belled=false, raf=0;

function load(){
  try{const o=JSON.parse(localStorage.getItem(KEY));
    if(o&&Array.isArray(o.slots)&&o.slots.length===4)return o;}catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const tot=()=>S.slots[cur].total;
const left=()=>status==='running'?Math.max(0,(endAt-Date.now())/1000):(status==='paused'?pausedLeft:tot());

/* ---------- 화면 ---------- */
function renderTabs(){
  $('tabs').innerHTML=S.slots.map((s,i)=>`<button class="tab ${i===cur?'on':''}" data-i="${i}">${esc(s.name)}<small>${fmt(s.total)}</small></button>`).join('');
}
function renderPresets(){
  $('presets').classList.toggle('show',cur===0);
  $('presets').innerHTML=PRESETS.map(([s,l])=>`<button class="btn ${tot()===s?'on':''}" data-s="${s}">${l}</button>`).join('');
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function paint(){
  const l=left(), st=$('stage');
  $('name').textContent=S.slots[cur].name;
  $('time').textContent=fmt(l);
  $('bar').style.transform='scaleX('+(tot()?l/tot():0)+')';
  const isBell=status==='running'||status==='paused'?false:false;
  $('go').textContent=status==='running'?'일시정지':(status==='paused'?'계속':'시작');
  $('go').classList.toggle('pause',status==='running');
  $('state').textContent=belled?'시간 종료':(status==='paused'?'일시정지':(status==='running'?'':'대기'));
  st.classList.toggle('bell',belled);
  st.classList.toggle('warn',warned&&!belled);
}
function tick(){
  if(status!=='running')return;
  const l=left();
  if(!warned&&!belled&&l<=S.slots[cur].flag&&l>0&&S.slots[cur].flag>0){warned=true;beep(.15,880)}
  if(l<=0&&!belled){belled=true;warned=false;status='idle';pausedLeft=0;ring();vib();wl(false);}
  paint();
  if(status==='running')raf=requestAnimationFrame(tick);
}

/* ---------- 동작 ---------- */
function start(){
  unlock();
  if(belled){reset(true)}
  const l=status==='paused'?pausedLeft:tot();
  endAt=Date.now()+l*1000;status='running';warned=l<=S.slots[cur].flag&&S.slots[cur].flag>0&&l<tot()?true:false;
  wl(true);cancelAnimationFrame(raf);tick();
}
function pause(){pausedLeft=left();status='paused';cancelAnimationFrame(raf);wl(false);paint()}
function reset(silent){
  cancelAnimationFrame(raf);status='idle';warned=false;belled=false;pausedLeft=0;stopRing();wl(false);if(!silent)paint();
}
function pick(i){cur=i;reset();renderTabs();renderPresets();paint()}

$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)pick(+b.dataset.i)};
$('presets').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;
  const s=+b.dataset.s,sl=S.slots[0];sl.total=s;sl.flag=Math.min(sl.flag,Math.round(s/3));save();reset();renderTabs();renderPresets();paint()};
$('go').onclick=()=>{status==='running'?pause():start()};
$('reset').onclick=()=>reset();

/* ---------- 소리 / 진동 ---------- */
let ac=null,ringTimer=0;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(t0,f,d,type,vol){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.start(t0);o.stop(t0+d+.05);
}
function beep(d,f){unlock();if(ac)tone(ac.currentTime,f,d,'sine',.25)}
const BELLS=[
  t=>{[880,1109,1319].forEach((f,i)=>tone(t+i*.18,f,.9,'sine',.35))},                 // 차임
  t=>{tone(t,196,2,'sine',.5);tone(t,392,1.6,'triangle',.2);tone(t,588,1.2,'sine',.1)}, // 징
  t=>{for(let i=0;i<4;i++)tone(t+i*.15,1200,.1,'square',.18)},                          // 디지털
  t=>{tone(t,440,.9,'sawtooth',.25);tone(t+.05,445,.85,'sawtooth',.2)}                  // 부저
];
function playBell(n){unlock();if(ac)BELLS[n](ac.currentTime+.02)}
function ring(){playBell(S.bell);let n=1;clearInterval(ringTimer);ringTimer=setInterval(()=>{if(++n>3){clearInterval(ringTimer);return}playBell(S.bell)},2200)}
function stopRing(){clearInterval(ringTimer)}
function vib(){try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}}

/* ---------- 화면 꺼짐 방지 ---------- */
let lock=null;
async function wl(on){
  try{
    if(on&&'wakeLock' in navigator){lock=await navigator.wakeLock.request('screen');$('wl').textContent='🔆 화면 켜짐 유지'}
    else if(lock){await lock.release();lock=null;$('wl').textContent=''}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&status==='running')wl(true)});

/* ---------- 설정 ---------- */
function openSet(){
  $('rows').innerHTML=S.slots.map((s,i)=>`<div class="row">
    <div><label>슬롯 ${i+1} 이름</label><input data-k="name" data-i="${i}" maxlength="12" value="${esc(s.name)}"></div>
    <div><label>총 시간(초)</label><input data-k="total" data-i="${i}" type="number" inputmode="numeric" min="5" max="7200" value="${s.total}"></div>
    <div><label>경고(남은 초)</label><input data-k="flag" data-i="${i}" type="number" inputmode="numeric" min="0" max="3600" value="${s.flag}"></div></div>`).join('');
  $('bellSel').value=S.bell;$('modal').classList.add('show');
}
$('open').onclick=openSet;
$('cancel').onclick=()=>$('modal').classList.remove('show');
$('preview').onclick=()=>playBell(+$('bellSel').value);
$('save').onclick=()=>{
  const n=JSON.parse(JSON.stringify(S));
  document.querySelectorAll('#rows input').forEach(el=>{
    const sl=n.slots[+el.dataset.i],k=el.dataset.k;
    if(k==='name')sl.name=el.value.trim()||DEF.slots[+el.dataset.i].name;
    else{let v=Math.round(+el.value);if(!isFinite(v)||v<0)v=DEF.slots[+el.dataset.i][k];sl[k]=v}
  });
  n.slots.forEach(s=>{s.total=Math.min(7200,Math.max(5,s.total));s.flag=Math.min(s.flag,s.total-1)});
  n.bell=+$('bellSel').value;S=n;save();
  $('modal').classList.remove('show');reset();renderTabs();renderPresets();paint();
};

renderTabs();renderPresets();paint();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
